    <!-- Apply the stored or system theme before first paint, so there is no flash. -->
    <style>
      html { background: #0c0d0f; }
      html[data-theme='light'] { background: #f4f1ea; }
    </style>
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var t;
        try { t = localStorage.getItem('ps-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#f4f1ea' : '#0c0d0f');
      })();
    </script>
